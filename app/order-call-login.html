<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주문호출관리 시스템 — SyncSign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./styles.css">
<!--
 주문호출관리 시스템 로그인 (SyncSign SaaS 전용) — 매장 관리 › 매장 상세 › [번호호출] › '수동 입력' 사이트 링크의 도착 페이지.
 흐름: 매장 검색 → 매장 선택 → 계정 비밀번호 입력 → [로그인] → 주문호출 화면(이번 범위 밖, 자리표시).
 기존 시스템(sdm.el-bigs.com/register)과 달리 '소상공인/프랜차이즈' 유형 선택이 없다 — SaaS 계정의 매장 정보만으로 로그인.
 TODO(API)
  · 매장 검색: GET /order-call/stores?q= → [{id,name,addr,manual:boolean}] (번호호출 '수동 입력'을 사용 중인 매장만 manual=true)
  · 로그인:   POST /order-call/sessions {storeId,password} → 세션 토큰 발급 후 주문호출 화면으로 이동 (401 = 비밀번호 불일치)
  · 최종 도메인 확정 시 CMS 링크(prototype.html drawCallTab의 call-url) 주소·복사 문구도 함께 교체
-->
<style>
body.ocl{overflow:auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
body.ocl #app{flex:1;display:flex;flex-direction:column;min-width:0;height:auto;min-height:100vh}
.ocl-top{display:flex;align-items:center;padding:24px 32px;flex:none}
.ocl-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 96px}
.ocl-card{width:440px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:40px 36px 36px}
.ocl-card h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ocl-card .sub{margin:0 0 28px;font-size:14px;color:var(--text-2);line-height:1.6}
.ocl-lbl{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px}
/* 매장 검색 콤보박스 */
.ocl-search{position:relative}
.ocl-search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.ocl-search .input{height:48px;padding:0 42px 0 42px;font-size:15px}
.ocl-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ocl-clear:hover{background:var(--sunken);color:var(--text-2)}
.ocl-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:6px;max-height:300px;overflow-y:auto;margin:0;list-style:none}
.ocl-opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);cursor:pointer}
.ocl-opt.act{background:var(--blue-50)}
.ocl-opt .tx{flex:1;min-width:0}
.ocl-opt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-opt b mark{background:none;color:var(--blue);font-weight:700}
.ocl-opt span{display:block;font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-opt.dis{cursor:default}
.ocl-opt.dis .tx{opacity:.55}
.ocl-opt.dis em{font-style:normal;font-size:12px;color:var(--text-3);flex:none}
.ocl-none{padding:22px 12px;text-align:center;font-size:13px;color:var(--text-3);line-height:1.6}
.ocl-none b{display:block;color:var(--text-2);font-size:14px;margin-bottom:2px}
/* 선택한 매장 */
.ocl-picked{display:flex;align-items:center;gap:12px;height:64px;padding:0 10px 0 16px;border:1px solid var(--blue);border-radius:var(--r-md);background:var(--blue-50)}
.ocl-picked .tx{flex:1;min-width:0}
.ocl-picked b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-picked span{display:block;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-hint{font-size:12px;color:var(--text-3);margin:8px 0 0;line-height:1.55}
.ocl-go{width:100%;margin-top:24px;height:48px;font-size:15px}
/* 계정 비밀번호 */
.ocl-pw{margin-top:20px}
.ocl-pwbox{position:relative}
.ocl-pwbox .input{height:48px;padding:0 46px 0 14px;font-size:15px}
.ocl-pwbox .input:disabled{background:var(--sunken);cursor:not-allowed}
.ocl-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ocl-eye:hover{background:var(--sunken);color:var(--text-2)}
.ocl-eye:disabled{display:none}
.ocl-pw .ferr[hidden]{display:none}
.ocl-foot{margin:20px 0 0;text-align:center;font-size:12px;color:var(--text-3);line-height:1.6}
/* 로그인 이후(이번 범위 밖 — 자리표시) */
.ocl-app{flex:1;display:flex;flex-direction:column}
.ocl-bar{display:flex;align-items:center;gap:14px;height:64px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.ocl-bar .sep{width:1px;height:18px;background:var(--border-2)}
.ocl-bar .nm{font-size:15px;font-weight:700}
.ocl-ph{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.ocl-ph .empty{background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--r-xl);width:100%;max-width:560px}
@media (max-width:520px){.ocl-top{padding:18px 16px}.ocl-card{padding:32px 20px 28px;border-radius:var(--r-lg)}.ocl-bar{padding:0 16px}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);
const LOGO='<svg viewBox="0 0 146 39" style="height:26px;width:auto;display:block" role="img" aria-label="syncsign"><use href="#logo-light"/></svg>';
const IC={
 search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
 eye:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeOff:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.6 3.4M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,{err}={}){
 const t=document.createElement('div');t.className='toast'+(err?' err':'');
 t.innerHTML=`${err?IC.x:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>'}<span>${msg}</span>`;
 $('#toasts').appendChild(t);setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320)},3200);
}
/* [MOCK DATA] 이 SaaS 계정의 매장 목록. CMS(prototype.html)에서 링크를 누르면 현재 매장 관리 상태를 localStorage('ss.callStores')로 넘겨준다.
   직접 열었거나 저장소를 쓸 수 없으면 아래 기본값 사용. manual = 번호호출 '수동 입력' 사용 중(로그인 가능) */
let STORES=[
 {id:'s1',name:'강남대로점',addr:'서울 강남구 강남대로 396',manual:true},
 {id:'s2',name:'인천공항 1터미널',addr:'인천 중구 공항로 272',manual:false},
 {id:'s3',name:'잠실롯데월드점',addr:'서울 송파구 올림픽로 240',manual:false},
 {id:'s4',name:'서면점',addr:'부산 부산진구 서면로 39',manual:false},
 {id:'s5',name:'홍대입구점',addr:'서울 마포구 양화로 160',manual:false},
 {id:'s6',name:'판교테크노밸리점',addr:'경기 성남시 분당구 판교역로 235',manual:false},
 {id:'s7',name:'해운대점',addr:'부산 해운대구 해운대해변로 264',manual:true},
 {id:'s8',name:'제주공항점',addr:'제주 제주시 공항로 2',manual:false},
];
try{const v=JSON.parse(localStorage.getItem('ss.callStores')||'null');if(Array.isArray(v)&&v.length)STORES=v;}catch(e){}

let q='',picked=null,act=-1,open=false;
const results=()=>{const k=q.trim().replace(/\s+/g,'').toLowerCase();if(!k)return[];
 return STORES.filter(s=>s.name.replace(/\s+/g,'').toLowerCase().includes(k)||(s.addr||'').replace(/\s+/g,'').includes(k))
  .sort((a,b)=>(b.manual-a.manual)||a.name.localeCompare(b.name,'ko'));};
const hl=name=>{const k=q.trim();if(!k)return esc(name);const i=name.toLowerCase().indexOf(k.toLowerCase());
 return i<0?esc(name):esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+k.length))+'</mark>'+esc(name.slice(i+k.length));};

function renderLogin(){
 document.title='주문호출관리 시스템 — SyncSign';
 $('#app').innerHTML=`
 <header class="ocl-top">${LOGO}</header>
 <main class="ocl-main"><section class="ocl-card" aria-labelledby="ocl-title">
  <h1 id="ocl-title">주문호출관리 시스템</h1>
  <p class="sub">매장을 선택하고 매장 계정 비밀번호를 입력해 로그인해 주세요.</p>
  <label class="ocl-lbl" for="ocl-q">매장</label>
  <div id="ocl-field"></div>
  <div class="ocl-pw"><label class="ocl-lbl" for="ocl-pw">비밀번호</label>
   <div class="ocl-pwbox"><input class="input" id="ocl-pw" type="password" autocomplete="current-password" placeholder="매장을 먼저 선택해 주세요" disabled>
    <button class="ocl-eye" id="ocl-eye" type="button" aria-label="비밀번호 보기" aria-pressed="false" disabled>${IC.eye}</button></div>
   <div class="ferr" id="ocl-pw-err" hidden></div></div>
  <button class="btn btn-primary ocl-go" id="ocl-go" disabled>로그인</button>
  <p class="ocl-foot">매장 관리 › 번호호출에서 <b style="color:var(--text-2);font-weight:600">수동 입력</b>을 사용 중인 매장만 로그인할 수 있어요.</p>
 </section></main>`;
 drawField();
 $('#ocl-go').onclick=login;
 const pw=$('#ocl-pw'),eye=$('#ocl-eye');
 pw.addEventListener('input',()=>{clearPwErr();syncGo();});
 pw.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login();}});
 eye.onclick=()=>{const show=pw.type==='password';pw.type=show?'text':'password';eye.innerHTML=show?IC.eyeOff:IC.eye;
  eye.setAttribute('aria-pressed',String(show));eye.setAttribute('aria-label',show?'비밀번호 숨기기':'비밀번호 보기');pw.focus();};
}
const syncGo=()=>{const go=$('#ocl-go');if(go&&!go.dataset.loading)go.disabled=!(picked&&$('#ocl-pw').value);};
const clearPwErr=()=>{$('#ocl-pw').classList.remove('error');$('#ocl-pw-err').hidden=true;};
const showPwErr=msg=>{const pw=$('#ocl-pw'),er=$('#ocl-pw-err');pw.classList.add('error');er.textContent=msg;er.hidden=false;pw.focus();pw.select();};
/* 매장 선택 여부에 따라 비밀번호 입력 활성/비활성 — 매장을 바꾸면 입력한 비밀번호는 지운다 */
function syncPw(){
 const pw=$('#ocl-pw'),eye=$('#ocl-eye');
 if(!picked){pw.value='';pw.type='password';eye.innerHTML=IC.eye;eye.setAttribute('aria-pressed','false');clearPwErr();}
 pw.disabled=eye.disabled=!picked;pw.placeholder=picked?'비밀번호를 입력해 주세요':'매장을 먼저 선택해 주세요';
 syncGo();
}
function drawField(){
 const f=$('#ocl-field');
 syncPw();
 if(picked){
  f.innerHTML=`<div class="ocl-picked"><div class="tx"><b>${esc(picked.name)}</b><span>${esc(picked.addr||'주소 미등록')}</span></div>
   <button class="btn btn-sm" id="ocl-change" type="button">변경</button></div>`;
  $('#ocl-change').onclick=()=>{picked=null;drawField();$('#ocl-q').focus();$('#ocl-q').select();};
  return;
 }
 f.innerHTML=`<div class="ocl-search" id="ocl-search">${IC.search}
  <input class="input" id="ocl-q" type="text" placeholder="매장 이름을 입력해 주세요" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="ocl-list" aria-autocomplete="list" value="${esc(q)}">
  <button class="ocl-clear" id="ocl-clear" type="button" aria-label="검색어 지우기" ${q?'':'hidden'}>${IC.x}</button>
  <ul class="ocl-list" id="ocl-list" role="listbox" hidden></ul></div>
  <p class="ocl-hint">매장 이름이나 주소 일부만 입력해도 찾을 수 있어요.</p>`;
 const inp=$('#ocl-q');
 inp.addEventListener('input',()=>{q=inp.value;act=-1;open=!!q.trim();$('#ocl-clear').hidden=!q;drawList();});
 inp.addEventListener('focus',()=>{if(q.trim()){open=true;drawList();}});
 inp.addEventListener('keydown',e=>{
  const rs=results(),ok=rs.map((s,i)=>s.manual?i:-1).filter(i=>i>=0);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!ok.length)return;e.preventDefault();open=true;
   const p=ok.indexOf(act);act=e.key==='ArrowDown'?ok[(p+1)%ok.length]:ok[(p<=0?ok.length:p)-1];drawList();}
  else if(e.key==='Enter'){e.preventDefault();const i=act>=0?act:(ok.length===1?ok[0]:-1);if(i>=0)pick(rs[i]);}
  else if(e.key==='Escape'){if(open){e.stopPropagation();open=false;drawList();}}
 });
 $('#ocl-clear').onclick=()=>{q='';inp.value='';$('#ocl-clear').hidden=true;open=false;drawList();inp.focus();};
}
function drawList(){
 const ul=$('#ocl-list'),inp=$('#ocl-q');if(!ul)return;
 const rs=results();
 ul.hidden=!open;inp.setAttribute('aria-expanded',String(open));
 if(!open)return;
 ul.innerHTML=rs.length?rs.map((s,i)=>`<li class="ocl-opt ${s.manual?'':'dis'} ${i===act?'act':''}" role="option" id="ocl-o${i}" data-i="${i}" aria-disabled="${!s.manual}" aria-selected="${i===act}">
   <div class="tx"><b>${hl(s.name)}</b><span>${esc(s.addr||'주소 미등록')}</span></div>${s.manual?'':'<em>수동 입력 미사용</em>'}</li>`).join('')
  :`<li class="ocl-none"><b>검색 결과가 없어요</b>매장 관리에 등록된 매장 이름을 확인해 주세요.</li>`;
 inp.setAttribute('aria-activedescendant',act>=0?'ocl-o'+act:'');
 ul.querySelector('.act')?.scrollIntoView({block:'nearest'});
 ul.querySelectorAll('.ocl-opt:not(.dis)').forEach(li=>{
  li.addEventListener('mousedown',e=>{e.preventDefault();pick(rs[+li.dataset.i]);});
  li.addEventListener('mousemove',()=>{if(act!==+li.dataset.i){act=+li.dataset.i;ul.querySelectorAll('.ocl-opt').forEach(o=>o.classList.toggle('act',o===li));}});
 });
}
document.addEventListener('mousedown',e=>{if(open&&!e.target.closest('#ocl-search')){open=false;drawList();}});
function pick(s){if(!s||!s.manual)return;picked=s;open=false;act=-1;drawField();$('#ocl-pw').focus();}
function login(){
 const go=$('#ocl-go'),pw=$('#ocl-pw');if(!picked||go.dataset.loading)return;
 if(!pw.value){showPwErr('비밀번호를 입력해 주세요.');return;}
 go.dataset.loading='1';go.disabled=true;go.innerHTML='<span class="spinner inv"></span>';pw.disabled=true;
 const done=()=>{delete go.dataset.loading;go.textContent='로그인';pw.disabled=false;syncGo();};
 /* TODO(API): POST /order-call/sessions {storeId,password} — 401: 비밀번호 불일치(입력 아래 오류) / 그 외 실패: 오류 Toast. 둘 다 버튼 복구
    [MOCK] 비밀번호는 아무 값이나 통과. 재현: window.__OCL_PW_WRONG=true(불일치) · window.__OCL_LOGIN_FAIL=true(서버 오류) */
 setTimeout(()=>{
  if(window.__OCL_PW_WRONG){done();showPwErr('비밀번호가 일치하지 않아요. 다시 확인해 주세요.');return;}
  if(window.__OCL_LOGIN_FAIL){done();toast('로그인하지 못했어요. 잠시 후 다시 시도해 주세요.',{err:true});return;}
  renderApp(picked);
 },900);
}
/* 로그인 이후 — 주문호출 화면은 이번 범위 밖이라 자리표시만 둔다 */
function renderApp(s){
 document.title=`${s.name} · 주문호출관리 — SyncSign`;
 $('#app').innerHTML=`<div class="ocl-app">
  <header class="ocl-bar">${LOGO}<span class="sep"></span><span class="nm">${esc(s.name)}</span>
   <span style="flex:1"></span><button class="btn btn-sm" id="ocl-out">로그아웃</button></header>
  <main class="ocl-ph"><div class="empty"><b>주문호출 화면</b><span>'${esc(s.name)}' 매장으로 로그인했어요.<br>주문 번호 입력·호출 화면은 이번 프로토타입 범위에 포함되지 않아요.</span></div></main></div>`;
 toast(`'${esc(s.name)}' 매장으로 로그인했어요.`);
 $('#ocl-out').onclick=()=>{picked=null;q='';renderLogin();};
}
renderLogin();
})();
</script>
</body>
</html>
