<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>주문호출관리 시스템 — SyncSign</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./styles.css">
<!--
 주문호출관리 시스템 로그인 (SyncSign SaaS 전용) — 매장 관리 › 매장 상세 › [번호호출] › '수동 입력' 사이트 링크의 도착 페이지.
 매장에는 별도 계정·비밀번호가 없다. 매장을 관리하는 사용자가 SyncSign 개인 계정으로 로그인한 뒤 매장을 고른다.
 흐름: Step 01 관리자 계정 로그인(이메일·비밀번호) → Step 02 번호호출을 사용할 매장 선택 → [시작하기] → 주문호출 화면(이번 범위 밖, 자리표시).
 매장 목록 권한(서버가 판단, 프론트는 받은 목록만 그린다)
  · 최고관리자(owner)            → 브랜드 전체 매장
  · 관리자·뷰어(admin/viewer)    → 계정에 연결된 매장만 (사용자 관리의 '담당 매장' 범위 · 매장 관리의 담당자 지정)
 TODO(API)
  · 로그인:     POST /auth/login {email,password} — CMS 로그인과 같은 인증. → {accessToken, user:{id,name,email,role}}
                401 = 이메일·비밀번호 불일치(입력 아래 오류) / 그 외 실패 = 오류 Toast
  · Google:     CMS와 같은 Google OAuth(GET /auth/google?redirect=<이 페이지>) → 콜백에서 accessToken 발급
                SyncSign에 가입되지 않은 Google 계정 = 404 → 오류 Toast(가입은 CMS에서)
  · 매장 목록:  GET /order-call/stores (Authorization) → [{id,name,addr,manual}] — 권한 범위는 서버가 필터링.
                manual = 번호호출 '수동 입력' 사용 중(선택 가능). 매장이 많으면 ?q= 서버 검색으로 전환
  · 시작:       POST /order-call/sessions {storeId} (Authorization) → 주문호출 화면 진입. 403 = 그 사이 권한 회수 → 목록 다시 조회
  · 최종 도메인 확정 시 CMS 링크(prototype.html drawCallTab의 call-url) 주소·복사 문구도 함께 교체
-->
<style>
body.ocl{overflow:auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
body.ocl #app{flex:1;display:flex;flex-direction:column;min-width:0;height:auto;min-height:100vh}
.ocl-top{display:flex;align-items:center;padding:24px 32px;flex:none}
.ocl-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px 96px}
.ocl-card{width:480px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:40px 36px 36px;animation:fade .18s ease-out}
.ocl-card h1{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.ocl-card .sub{margin:0 0 28px;font-size:15px;color:var(--text-2);line-height:1.6;word-break:keep-all}
.ocl-lbl{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.ocl-f+.ocl-f{margin-top:18px}
.ocl-f .input{height:48px;padding:0 14px;font-size:15px}
.ocl-f .ferr[hidden]{display:none}
.ocl-pwbox{position:relative}
.ocl-pwbox .input{padding-right:46px}
.ocl-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ocl-eye:hover{background:var(--sunken);color:var(--text-2)}
.ocl-go{width:100%;margin-top:24px;height:48px;font-size:15px}
.ocl-foot{margin:20px 0 0;text-align:center;font-size:13px;color:var(--text-3);line-height:1.6;word-break:keep-all}
.ocl-demo{margin:16px 0 0;padding:12px 14px;border:1px dashed var(--border-2);border-radius:var(--r-md);font-size:13px;color:var(--text-3);line-height:1.6}
.ocl-demo button{border:0;background:none;padding:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer}
/* Step 02 — 로그인한 계정 */
.ocl-acct{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--sunken);margin-bottom:24px}
.ocl-acct .tx{flex:1;min-width:0}
.ocl-acct b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}
.ocl-acct span.em{display:block;font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-acct .btn{flex:none}
/* Step 02 — 매장 검색 + 목록 */
.ocl-search{position:relative}
.ocl-search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.ocl-search .input{height:44px;padding:0 42px;font-size:15px}
.ocl-search .input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none} /* 브라우저 기본 x 숨김 — #ocl-clear만 사용 */
.ocl-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ocl-clear:hover{background:var(--sunken);color:var(--text-2)}
.ocl-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px 8px;font-size:13px;color:var(--text-3)}
.ocl-meta b{color:var(--text-2);font-weight:600}
.ocl-list{border:1px solid var(--border);border-radius:var(--r-lg);max-height:312px;overflow-y:auto;padding:4px;margin:0}
.ocl-store{position:relative;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-md);cursor:pointer;border:1.5px solid transparent}
.ocl-store+.ocl-store{margin-top:2px}
.ocl-store:hover{background:var(--sunken)}
.ocl-store.on{background:var(--blue-50);border-color:var(--blue)}
.ocl-store input{position:absolute;opacity:0;pointer-events:none}
.ocl-store .radio{flex:none}
.ocl-store:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:-2px}
.ocl-store .tx{flex:1;min-width:0}
.ocl-store .tx b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-store .tx b mark{background:none;color:var(--blue);font-weight:700}
.ocl-store .tx span{display:block;font-size:13px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocl-store.dis{cursor:default}
.ocl-store.dis:hover{background:none}
.ocl-store.dis .tx,.ocl-store.dis .radio{opacity:.5}
.ocl-store em{font-style:normal;font-size:13px;color:var(--text-3);flex:none}
.ocl-sk{display:flex;align-items:center;gap:12px;padding:13px 12px}
.ocl-state{padding:36px 16px;text-align:center;font-size:13px;color:var(--text-3);line-height:1.6;word-break:keep-all}
.ocl-state b{display:block;color:var(--text-2);font-size:15px;margin-bottom:4px}
.ocl-state .btn{margin-top:14px}
/* 로그인 이후(이번 범위 밖 — 자리표시) */
.ocl-app{flex:1;display:flex;flex-direction:column}
.ocl-bar{display:flex;align-items:center;gap:14px;height:64px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}
.ocl-bar .sep{width:1px;height:18px;background:var(--border-2)}
.ocl-bar .nm{font-size:15px;font-weight:700}
.ocl-ph{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 16px}
.ocl-ph .empty{background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--r-xl);width:100%;max-width:560px}
@media (max-width:520px){.ocl-top{padding:18px 16px}.ocl-card{padding:32px 20px 28px;border-radius:var(--r-lg)}.ocl-bar{padding:0 16px;gap:10px}.ocl-bar .who{display:none}}
</style>

 const ul=$('#ocl-list');if(!ul)return;
 const rs=filtered();
 $('#ocl-meta').innerHTML=`<span>${q.trim()?`검색 결과 <b>${rs.length}</b>개`:`접근 가능한 매장 <b>${list.length}</b>개`}</span>${picked?`<span>선택: <b>${esc(picked.name)}</b></span>`:''}`;
 ul.innerHTML=rs.length?rs.map(s=>{const on=picked&&picked.id===s.id;
  return `<label class="ocl-store ${s.manual?'':'dis'} ${on?'on':''}">
   <input type="radio" name="ocl-store" value="${esc(s.id)}" ${on?'checked':''} ${s.manual?'':'disabled'}>
   <span class="radio ${on?'on':''}" aria-hidden="true"></span>
   <span class="tx"><b>${hl(s.name)}</b><span>${esc(s.addr||'주소 미등록')}</span></span>${s.manual?'':'<em>수동 입력 미사용</em>'}</label>`;}).join('')
  :`<div class="ocl-state"><b>검색 결과가 없어요</b>매장 이름이나 주소를 다시 확인해 주세요.</div>`;
 ul.querySelectorAll('input').forEach(r=>{
  r.addEventListener('change',()=>{picked=list.find(s=>s.id===r.value);const f=document.activeElement===r;drawList();syncStart();if(f)ul.querySelector('input:checked')?.focus();});
  r.addEventListener('keydown',e=>{if(e.key==='Enter'&&picked){e.preventDefault();start();}});
 });
 syncStart();
}
async function start(){
 const b=$('#ocl-start');if(!picked||b.dataset.loading)return;
 const s=picked;
 b.dataset.loading='1';b.disabled=true;b.innerHTML='<span class="spinner inv"></span>';
 try{
  await apiStart(s.id);
  renderApp(s);
 }catch(e){
  delete b.dataset.loading;b.textContent='시작하기';
  if(e.status===403){toast('이 매장에 대한 접근 권한이 없어요. 매장 목록을 새로 불러올게요.',{err:true});loadStores();}
  else{syncStart();toast('번호호출을 시작하지 못했어요. 잠시 후 다시 시도해 주세요.',{err:true});}
 }
}

/* ───────── 진입 이후 — 주문호출 화면은 이번 범위 밖이라 자리표시만 둔다 ───────── */
function renderApp(s){
 document.title=`${s.name} · 주문호출관리 — SyncSign`;
 $('#app').innerHTML=`<div class="ocl-app">
  <header class="ocl-bar">${LOGO}<span class="sep"></span><span class="nm">${esc(s.name)}</span>
   <span style="flex:1"></span><span class="who" style="font-size:13px;color:var(--text-3)">${esc(me.name)} · ${esc(me.email)}</span>
   <button class="btn btn-sm" id="ocl-switch">매장 변경</button><button class="btn btn-sm" id="ocl-out">로그아웃</button></header>
  <main class="ocl-ph"><div class="empty"><b>주문호출 화면</b><span>'${esc(s.name)}' 매장으로 번호호출을 시작했어요.<br>주문 번호 입력·호출 화면은 이번 프로토타입 범위에 포함되지 않아요.</span></div></main></div>`;
 toast(`'${esc(s.name)}' 매장으로 시작했어요.`);
 $('#ocl-switch').onclick=()=>{q='';renderStores();};
 $('#ocl-out').onclick=()=>{toast('로그아웃했어요.');renderLogin();};
}
renderLogin();
})();
</script>
</body>
</html>
